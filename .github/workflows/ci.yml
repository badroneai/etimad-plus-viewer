name: Kashaf PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Kashaf quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned quality gates
        run: python -m pip install -r requirements-dev.txt

      - name: Install pinned browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Enforce Ruff quality gate
        run: python -m ruff check .

      - name: Enforce mypy quality gate
        run: python -m mypy

      - name: Verify Python tests
        run: python -m unittest discover -s tests -v

      - name: Verify browser JavaScript syntax
        run: node --check assets/app.js

      - name: Verify browser behavior
        run: node --test tests/test_app.cjs

      - name: Verify end-to-end browser behavior
        run: npm run test:e2e

      - name: Verify local static-data contract
        run: python scripts/check_data_contract.py --root .
