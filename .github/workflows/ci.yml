name: Kashaf PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Kashaf quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install pinned quality gates
        run: python -m pip install -r requirements-dev.txt

      - name: Enforce Ruff quality gate
        run: python -m ruff check .

      - name: Enforce mypy quality gate
        run: python -m mypy

      - name: Verify Python tests
        run: python -m unittest discover -s tests -v

      - name: Verify browser JavaScript syntax
        run: node --check assets/app.js

      - name: Verify browser behavior
        run: node --test tests/test_app.cjs

      - name: Verify local static-data contract
        run: python scripts/check_data_contract.py --root .
