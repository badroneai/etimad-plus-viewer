name: Kashaf observability watchdog

on:
  schedule:
    - cron: "27 3,15 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kashaf-observability-watchdog
  cancel-in-progress: true

jobs:
  health:
    name: Evaluate publication and Pages SLOs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out watchdog revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Check out authenticated publication history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: publication/kashaf-data
          path: _publication
          fetch-depth: 5
          persist-credentials: false

      - name: Collect publication history and Pages evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/kashaf-watchdog"
          history="${evidence}/status-history"
          mkdir -p "${history}"
          git -C _publication show HEAD:data/manifest.json \
            > "${evidence}/publication-manifest.json"
          git -C _publication show -s --format=%cI HEAD \
            > "${evidence}/publication-committed-at.txt"
          index=0
          while read -r revision; do
            printf -v name '%02d.json' "${index}"
            if git -C _publication show "${revision}:data/fetch_status.json" \
              > "${history}/${name}"; then
              index=$((index + 1))
            fi
          done < <(git -C _publication rev-list --max-count=5 HEAD)

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?per_page=10" \
            > "${evidence}/pages-runs.json"
          jq -n '{}' > "${evidence}/pages-jobs.json"
          while read -r run_id; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '.jobs' > "${evidence}/run-${run_id}-jobs.json"
            jq --arg id "${run_id}" \
              --slurpfile jobs "${evidence}/run-${run_id}-jobs.json" \
              '. + {($id): $jobs[0]}' "${evidence}/pages-jobs.json" \
              > "${evidence}/pages-jobs.next.json"
            mv "${evidence}/pages-jobs.next.json" "${evidence}/pages-jobs.json"
          done < <(jq -r '.workflow_runs[:3][] | .id' "${evidence}/pages-runs.json")

      - name: Probe live manifest and full data contract
        id: contract
        env:
          BASE_URL: https://badroneai.github.io/etimad-plus-viewer
          EVIDENCE_ROOT: ${{ runner.temp }}/kashaf-watchdog
        run: |
          set -euo pipefail
          expected="$(jq -r '.snapshot_id' "${EVIDENCE_ROOT}/publication-manifest.json")"
          set +e
          curl -fsS \
            "${BASE_URL}/data/manifest.json?watchdog=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > "${EVIDENCE_ROOT}/live-manifest.json"
          curl_code=$?
          if (( curl_code != 0 )) || ! jq -e 'type == "object"' \
            "${EVIDENCE_ROOT}/live-manifest.json" >/dev/null 2>&1; then
            rm -f "${EVIDENCE_ROOT}/live-manifest.json"
          fi
          python scripts/check_data_contract.py \
            --base-url "${BASE_URL}" \
            --expect-snapshot-id "${expected}" \
            > "${EVIDENCE_ROOT}/contract.log" 2>&1
          contract_code=$?
          set -e
          echo "exit_code=${contract_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Evaluate machine-readable operational health
        env:
          CONTRACT_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
          EVIDENCE_ROOT: ${{ runner.temp }}/kashaf-watchdog
        run: |
          set -euo pipefail
          live_args=()
          if [[ -f "${EVIDENCE_ROOT}/live-manifest.json" ]]; then
            live_args=(--live-manifest "${EVIDENCE_ROOT}/live-manifest.json")
          fi
          python scripts/observability.py \
            --publication-manifest "${EVIDENCE_ROOT}/publication-manifest.json" \
            "${live_args[@]}" \
            --pages-runs-json "${EVIDENCE_ROOT}/pages-runs.json" \
            --pages-jobs-json "${EVIDENCE_ROOT}/pages-jobs.json" \
            --status-history-dir "${EVIDENCE_ROOT}/status-history" \
            --contract-exit-code "${CONTRACT_EXIT_CODE}" \
            --publication-committed-at "$(<"${EVIDENCE_ROOT}/publication-committed-at.txt")" \
            --output-json "${EVIDENCE_ROOT}/health.json" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --fail-on-critical

      - name: Emit actionable alert annotation
        if: always()
        env:
          REPORT: ${{ runner.temp }}/kashaf-watchdog/health.json
        run: |
          set -euo pipefail
          if [[ ! -f "${REPORT}" ]]; then
            echo "::error title=Kashaf watchdog unavailable::No health report was produced. Inspect publication-branch and GitHub API access."
            exit 0
          fi
          state="$(jq -r '.state' "${REPORT}")"
          convergence="$(jq -r '.checks.pages_convergence.incident_class' "${REPORT}")"
          pages="$(jq -r '.checks.pages_workflow.incident_class' "${REPORT}")"
          if [[ "${state}" == "critical" ]]; then
            echo "::error title=Kashaf SLO breach::convergence=${convergence}; pages=${pages}; follow INCIDENT_PLAYBOOK.md"
          elif [[ "${state}" == "warning" ]]; then
            echo "::warning title=Kashaf SLO warning::convergence=${convergence}; pages=${pages}; follow INCIDENT_PLAYBOOK.md"
          fi

      - name: Upload bounded watchdog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kashaf-health-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kashaf-watchdog/health.json
            ${{ runner.temp }}/kashaf-watchdog/publication-manifest.json
            ${{ runner.temp }}/kashaf-watchdog/publication-committed-at.txt
            ${{ runner.temp }}/kashaf-watchdog/live-manifest.json
            ${{ runner.temp }}/kashaf-watchdog/pages-runs.json
            ${{ runner.temp }}/kashaf-watchdog/pages-jobs.json
            ${{ runner.temp }}/kashaf-watchdog/status-history
            ${{ runner.temp }}/kashaf-watchdog/contract.log
