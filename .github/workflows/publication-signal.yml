name: Kashaf data publication signal

on:
  push:
    branches: ["publication/kashaf-data"]

permissions:
  contents: read

jobs:
  acknowledge:
    name: Acknowledge publication commit
    runs-on: ubuntu-24.04
    steps:
      - name: Record the immutable publication revision
        env:
          PUBLICATION_SHA: ${{ github.sha }}
        run: echo "Publication revision ${PUBLICATION_SHA} is ready for trusted validation."
